name: Update Kumon CIDRs List

on:
  schedule:
    - cron: '0 0 * * *' # Triggers daily at 00:00 UTC
  workflow_dispatch: # Allows manual trigger within GitHub UI

jobs:
  refresh-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run CIDR Generator
      run: python generate_cidrs.py

    - name: Commit and Push if updated
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ip-lists/*.txt
        if git diff --staged --quiet; then
          echo "No infrastructure changes detected from Kumon servers."
        else
          git commit -m "Automated Sync: Updated Kumon Firewall IP CIDR Lists"
          git push
        fi
